name: Оновити index.toml
on:
  push:
    branches: [main]
    paths-ignore: ['index.toml', 'pack.toml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/build_index.py
      - run: |
          git config user.name "svitlo-bot"
          git config user.email "svitlo-bot@users.noreply.github.com"
          git add index.toml pack.toml
          git diff --cached --quiet || (git commit -m "Оновлено index.toml" && git push)
